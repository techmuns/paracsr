name: CSR pipeline
on:
  workflow_dispatch:
    inputs:
      mode:   { description: "csr | universe", required: false, type: string, default: "csr" }
      ticker: { description: "Ticker(s), comma-separated (blank = batch)", required: false, type: string }
      limit:  { description: "Max companies this run", required: false, type: string, default: "70" }
      force:  { description: "Re-do companies already done", required: false, type: boolean, default: false }
  schedule:
    - cron: "0 22 1,15 * *"       # 1st & 15th ~03:30 IST — twice-monthly (~15-day) refresh
    # - cron: "0 2 1 8 *"         # ~Aug 1, refresh the universe (enable after validating mode=universe)
permissions:
  contents: write
concurrency: { group: csr, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install deps + Chromium
        run: |
          npm install --no-save playwright pdfjs-dist
          npx playwright install --with-deps chromium
      - name: Git identity
        run: |
          git config user.name "paracsr-bot"
          git config user.email "actions@github.com"
      - name: Preflight — LLM key
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION:  ${{ secrets.BEDROCK_REGION }}
          BEDROCK_MODEL:   ${{ secrets.BEDROCK_MODEL }}
          LLM_PROVIDER:    ${{ secrets.LLM_PROVIDER }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
        run: node csr-pipeline/check-llm.mjs
      - name: Run pipeline (csr | universe)
        env:
          SCREENER_PREMIUM_EMAIL: ${{ secrets.SCREENER_PREMIUM_EMAIL }}
          SCREENER_PREMIUM_PASSWORD: ${{ secrets.SCREENER_PREMIUM_PASSWORD }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION:  ${{ secrets.BEDROCK_REGION }}
          BEDROCK_MODEL:   ${{ secrets.BEDROCK_MODEL }}
          LLM_PROVIDER:    ${{ secrets.LLM_PROVIDER }}
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MODE:   ${{ github.event.inputs.mode || (github.event.schedule == '0 2 1 8 *' && 'universe' || 'csr') }}
          TICKER: ${{ github.event.inputs.ticker }}
          LIMIT:  ${{ github.event.inputs.limit }}
          FORCE:  ${{ github.event.inputs.force == 'true' && '1' || '' }}
          REFRESH: ${{ github.event_name == 'schedule' && '1' || '' }}
          # A refresh only re-reads a report when its URL changed, so a full sweep of
          # all ~200 costs almost nothing — it checks everyone every run and re-reads
          # only the handful with a fresh annual report.
          MAX_PER_RUN: "220"
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$MODE" = "universe" ]; then
            node csr-pipeline/universe.mjs
          else
            node csr-pipeline/run.mjs
          fi
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: csr-artifacts, path: csr-pipeline/output, if-no-files-found: ignore, retention-days: 7 }
